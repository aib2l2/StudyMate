[pytest]
pythonpath = backend
testpaths = backend/tests
addopts = -q --cov=studymate --cov-report=term-missing:skip-covered --cov-fail-under=90
filterwarnings =
    # Starlette suggests a not-yet-established "httpx2" package; httpx stays pinned for now.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
